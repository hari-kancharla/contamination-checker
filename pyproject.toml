[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contamcheck"
version = "0.1.0"
description = "ContamCheckr: local benchmark contamination evidence for causal language models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hari Krishna Kancharla"}]
dependencies = [
  "torch",
  "transformers",
  "datasets",
  "numpy",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
contamcheck = "contamcheck.cli:main"

[tool.setuptools.packages.find]
include = ["contamcheck*"]

[tool.setuptools.data-files]
"share/contamcheck/data" = [
  "data/sample_benchmark.jsonl",
  "data/sample_control.jsonl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
